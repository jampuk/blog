# Sveltia CMS config for Jampuk Read.
# IMPORTANT: keep site_url identical to the PUBLIC_SITE_URL env var
# in Cloudflare Pages (default https://read.jampuk.com).
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
app_title: Jampuk Read CMS

backend:
  name: github
  repo: jampuk/blog
  branch: main
  # Token sign-in only: no OAuth client is deployed, so the
  # "Sign In with GitHub" button would dead-end at Netlify.
  auth_methods: [token]

site_url: https://read.jampuk.com
display_url: https://read.jampuk.com
logo:
  src: /favicons/favicon-48x48.png
  show_in_header: false

media_folder: public/images/uploads
public_folder: /images/uploads

# Sveltia writes a value for every field; without this an empty
# optional field (e.g. cover) is saved as "" and breaks the Astro schema.
output:
  omit_empty_optional_fields: true

# No editorial_workflow yet - direct publish keeps the stub phase simple.
# Enable later with: publish_mode: editorial_workflow
collections:
  - name: blog
    label: Posts
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: date, label: Date, widget: datetime, type: date, required: true }
      - { name: updated, label: Updated, widget: datetime, type: date, required: false, hint: "Optional. Publish date of the last revision - drives article:modified_time and the sitemap lastmod." }
      - { name: draft, label: Draft, widget: boolean, default: false, hint: "Drafts are hidden from listings until published." }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: coverAlt, label: Cover image alt text, widget: string, required: false, hint: "Describes the cover image for social previews. Falls back to the note title." }
      - { name: body, label: Body, widget: markdown }