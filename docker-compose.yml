# Local testing for Jampuk Read -> http://localhost:8088
# Usage:
#   docker compose up --build        # build + serve
#   docker compose up --build -d     # detached
#   docker compose down
services:
  read:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the Astro build; override per environment as needed.
        - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-http://localhost:8088}
        - PUBLIC_WEBSITE_URL=${PUBLIC_WEBSITE_URL:-https://www.jampuk.com}
    ports:
      - "8088:8088"
    restart: unless-stopped
